name: CI

on:
  pull_request:
  push:
    branches: [main]

# Evita rodar duas vezes o mesmo PR quando um novo commit chega enquanto o
# anterior ainda está rodando.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Segredos "de mentira", só para o build/servidor conseguirem subir no CI —
  # nenhuma integração real (Stripe/WhatsApp) é exercitada com valores reais
  # aqui. Os testes que precisam de assinatura geram a própria assinatura de
  # teste (ver testes de integração dos webhooks).
  BETTER_AUTH_SECRET: "ci-dummy-secret-not-for-production"
  BETTER_AUTH_URL: "http://localhost:3000"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  STRIPE_SECRET_KEY: "sk_test_ci_placeholder"
  STRIPE_WEBHOOK_SECRET: "whsec_ci_placeholder"

jobs:
  unit:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7

  integration:
    name: Testes de integração
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: m_agendy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/m_agendy_test"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/m_agendy_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # `push` sincroniza o schema.ts direto no banco efêmero do CI — não
      # depende do histórico de migrações (parte dele hoje é SQL manual em
      # drizzle/manual/, aplicado à mão no Neon; push garante o schema
      # completo independentemente disso). Ver docs/05-desenvolvimento.md.
      - run: npm run drizzle:push -- --force
      - run: npm run test:integration

  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [unit, integration]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: m_agendy_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/m_agendy_e2e"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/m_agendy_e2e"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run drizzle:push -- --force
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Só valida que a imagem builda (sem publicar) — pega quebra de build
      # do Dockerfile antes de um deploy real em cloud.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: m-agendy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
